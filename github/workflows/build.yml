name: Build Diwan Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Unpack project and create Android shell
        run: |
          set -e
          mkdir src && unzip -q project.zip -d src
          flutter create --org xyz.diwaniq --project-name app --platforms android shell
          rm -rf shell/lib shell/test
          cp -r src/lib shell/lib
          cp src/pubspec.yaml shell/pubspec.yaml

      - name: Prepare Firebase, signing, icon
        run: python3 src/tool/prepare.py shell google-services.json src/tool

      - name: Build
        working-directory: shell
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: diwan-android
          path: |
            shell/build/app/outputs/flutter-apk/app-release.apk
            shell/build/app/outputs/bundle/release/app-release.aab
